name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


jobs:

  backend:

    name: Backend Build and NUnit Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6


      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x


      - name: Restore API
        run: dotnet restore ./LocalLlmAssistant.Api/LocalLlmAssistant.Api.csproj


      - name: Restore Tests
        run: dotnet restore ./LocalLlmAssistant.Api.Tests/LocalLlmAssistant.Api.Tests.csproj


      - name: Build API
        run: >
          dotnet build
          ./LocalLlmAssistant.Api/LocalLlmAssistant.Api.csproj
          --configuration Release
          --no-restore


      - name: Run NUnit Tests
        run: >
          dotnet test
          ./LocalLlmAssistant.Api.Tests/LocalLlmAssistant.Api.Tests.csproj
          --configuration Release
          --no-restore
          --verbosity normal


  frontend:

    name: Angular Build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6


      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./LocalLlmAssistant.Web/package-lock.json


      - name: Install dependencies
        working-directory: ./LocalLlmAssistant.Web
        run: npm ci


      - name: Build Angular
        working-directory: ./LocalLlmAssistant.Web
        run: npm run build


  docker:

    name: Docker Image Build

    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:

      - name: Checkout
        uses: actions/checkout@v6


      - name: Build API image
        run: >
          docker build
          -t local-llm-assistant-api:ci
          ./LocalLlmAssistant.Api


      - name: Build Angular image
        run: >
          docker build
          -t local-llm-assistant-web:ci
          ./LocalLlmAssistant.Web