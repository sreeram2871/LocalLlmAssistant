name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # =========================================================
  # BACKEND
  # Build ASP.NET Core API and run NUnit tests
  # =========================================================

  backend:

    name: Backend Build and NUnit Tests

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # Setup .NET 8
      # ------------------------------------------------------

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x


      # ------------------------------------------------------
      # Restore API
      # ------------------------------------------------------

      - name: Restore API
        run: |
          dotnet restore \
            ./LocalLlmAssistant.Api/LocalLlmAssistant.Api.csproj


      # ------------------------------------------------------
      # Restore NUnit tests
      # ------------------------------------------------------

      - name: Restore Tests
        run: |
          dotnet restore \
            ./LocalLlmAssistant.Api.Tests/LocalLlmAssistant.Api.Tests.csproj


      # ------------------------------------------------------
      # Build API
      # ------------------------------------------------------

      - name: Build API
        run: |
          dotnet build \
            ./LocalLlmAssistant.Api/LocalLlmAssistant.Api.csproj \
            --configuration Release \
            --no-restore


      # ------------------------------------------------------
      # Run NUnit tests
      # ------------------------------------------------------

      - name: Run NUnit Tests
        run: |
          dotnet test \
            ./LocalLlmAssistant.Api.Tests/LocalLlmAssistant.Api.Tests.csproj \
            --configuration Release \
            --no-restore \
            --verbosity normal


  # =========================================================
  # FRONTEND
  # Build Angular application
  # =========================================================

  frontend:

    name: Angular Build

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # Setup Node.js 22
      # ------------------------------------------------------

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./LocalLlmAssistant.Web/package-lock.json


      # ------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        working-directory: ./LocalLlmAssistant.Web
        run: npm ci


      # ------------------------------------------------------
      # Build Angular
      # ------------------------------------------------------

      - name: Build Angular
        working-directory: ./LocalLlmAssistant.Web
        run: npm run build


  # =========================================================
  # DOCKER
  # Build and Push images to GitHub Container Registry
  # =========================================================

  docker:

    name: Build and Push Docker Images

    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    permissions:
      contents: read
      packages: write

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # Login to GitHub Container Registry
      # ------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ======================================================
      # API IMAGE
      # ======================================================

      - name: Build and Push API Image
        uses: docker/build-push-action@v7
        with:
          context: ./LocalLlmAssistant.Api
          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/localllmassistant-api:latest
            ghcr.io/${{ github.repository_owner }}/localllmassistant-api:${{ github.sha }}


      # ======================================================
      # ANGULAR IMAGE
      # ======================================================

      - name: Build and Push Web Image
        uses: docker/build-push-action@v7
        with:
          context: ./LocalLlmAssistant.Web
          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/localllmassistant-web:latest
            ghcr.io/${{ github.repository_owner }}/localllmassistant-web:${{ github.sha }}